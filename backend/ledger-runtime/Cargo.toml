[package]
name = "ledger-runtime"
description = "Runs the commands planned by ledger-core and keeps the Docker containers of an app ready."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
fake = []

[dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
ledger-core = { path = "../ledger-core" }
tokio = { version = "1.53.2", features = ["io-util", "macros", "process", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt", "time"] }
